name: Data-Algorithm Studio 冒烟业务链路
description: "使用默认管理员 admin/admin123 登录 Data-Algorithm Studio，然后完成完整业务链路：上传本地示例数据集文件 /Users/arthur/code/ui-mocker/demo_01/backend/sample_data/sensor_sample.csv 并命名为 sensor_sample，创建项目并绑定该数据集，进入工作区，在血缘根节点执行默认的描述性统计（describe）算法，查看结果并审核通过，使血缘树新增一个算法结果节点。"
start_url: http://localhost:5173/login
completion:
  mode: state_reached
  success:
    - 已登录并停留在数据集页面（URL 包含 /datasets）
    - 数据集列表出现 sensor_sample
    - 项目工作区血缘树出现描述性统计算法结果子节点（根节点之下新增节点）
  failure:
    - 登录页提示用户名或密码错误
    - 上传数据集失败或出现错误提示
    - 算法执行或审核通过失败
requiredOperations:
  - id: fill_login_credentials
    description: 在登录页填写用户名 admin 与密码 admin123
  - id: submit_login
    description: 点击登录按钮
  - id: upload_dataset
    description: 上传本地 CSV 文件并命名为 sensor_sample
  - id: create_project
    description: 新建项目并绑定 sensor_sample 数据集
  - id: run_descriptive_statistics
    description: 在血缘根节点执行描述性统计算法
  - id: approve_algorithm_result
    description: 审核通过算法结果并沉淀为血缘节点
timing:
  expected: 3分钟
  timeout: 10分钟
limits:
  maxActions: 60
  maxNoProgress: 8
