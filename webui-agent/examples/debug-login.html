<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Agent Debug Login</title></head>
<body>
  <main>
    <h1>测试登录</h1>
    <label>用户名 <input id="username" aria-label="用户名"></label>
    <label>密码 <input id="password" type="password" aria-label="密码"></label>
    <button id="login">登录</button>
    <p id="status" role="status">请登录</p>
  </main>
  <script>
    document.querySelector('#login').addEventListener('click', () => {
      const username = document.querySelector('#username').value;
      const password = document.querySelector('#password').value;
      setTimeout(() => {
        document.querySelector('#status').textContent = username === 'tester' && password === '123456'
          ? '欢迎回来，tester'
          : '账号或密码错误';
      }, 800);
    });
  </script>
</body>
</html>
