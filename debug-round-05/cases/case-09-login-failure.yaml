name: 错误密码登录失败
description: "在登录页使用用户名 admin 与错误密码 wrongpass123 尝试登录，登录应当失败并提示用户名或密码错误；不要执行其他操作。"
start_url: http://localhost:5173/login
completion:
  mode: state_reached
  success:
    - 页面显示登录成功或已离开登录页
  failure:
    - 页面提示用户名或密码错误
    - 页面仍在登录页且提示账号或密码错误
timing:
  expected: 30秒
  timeout: 4分钟
limits:
  maxActions: 10
  maxNoProgress: 5
